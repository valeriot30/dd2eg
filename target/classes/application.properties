spring.application.name=backend

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/dd2eg?w=majority&j=true&readPreference=primary&maxPoolSize=100&connectTimeoutMS=10000&serverSelectionTimeoutMS=5000&retryWrites=true
spring.data.mongodb.database=dd2eg
spring.data.mongodb.auto-index-creation=true

# Neo4j (driver manuale)
neo4j.uri=bolt://localhost:7687
neo4j.username=neo4j
neo4j.password=password


# Disabilita auto-config SDN per evitare conflitti col driver manuale
spring.neo4j.uri=${neo4j.uri}
spring.neo4j.authentication.username=${neo4j.username}
spring.neo4j.authentication.password=${neo4j.password}

# Abilita scheduling per Anomaly Detection
spring.main.allow-bean-definition-overriding=true
