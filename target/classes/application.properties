spring.application.name=backend

# Neo4j (driver manuale)
neo4j.uri=bolt://localhost:7687
neo4j.username=neo4j
neo4j.password=password

# Disabilita auto-config SDN per evitare conflitti col driver manuale
spring.neo4j.uri=${neo4j.uri}
spring.neo4j.authentication.username=${neo4j.username}
spring.neo4j.authentication.password=${neo4j.password}

# Abilita scheduling per Anomaly Detection
spring.main.allow-bean-definition-overriding=true
